<script type="text/babel" data-presets="react">

const CATEGORIES = [

const PAY_LABEL  = { yape:'Yape / Plin', efectivo:'Efectivo' };

/* ---------- Helpers ---------- */
const money = (n) => 'S/ ' + n.toFixed(2);
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const byId = (id) => PRODUCTS.find((p) => p.id === id);

function readCart() {
  try {
    const raw = JSON.parse(localStorage.getItem(CART_KEY) || '{}');
    const clean = {};
    Object.keys(raw).forEach((id) => {
      const q = parseInt(raw[id], 10);
      if (byId(id) && q > 0) clean[id] = Math.min(q, 99);
    });
    return clean;
  } catch (e) { return {}; }
}
function readClient() {
  try { return JSON.parse(localStorage.getItem(CLIENT_KEY) || '{}'); } catch (e) { return {}; }
}
function computeStatus() {
  let minutes;
  try {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone:'America/Lima', hour:'2-digit', minute:'2-digit', hour12:false
    }).formatToParts(new Date());
    const h = (+(parts.find(p => p.type === 'hour') || {}).value || 0) % 24;
    const m = +(parts.find(p => p.type === 'minute') || {}).value || 0;
    minutes = h * 60 + m;
  } catch (e) {
    const d = new Date();
    minutes = d.getHours() * 60 + d.getMinutes();
  }
  const M1 = 450, M2 = 720, M3 = 930, M4 = 1140;
  if ((minutes >= M1 && minutes < M2) || (minutes >= M3 && minutes < M4)) return { open:true, text:'Abierto ahora' };
  if (minutes < M1) return { open:false, text:'Abre 7:30 AM' };
  if (minutes >= M2 && minutes < M3) return { open:false, text:'Abre 3:30 PM' };
  return { open:false, text:'Cerrado' };
}

/* ---------- Hook: dinero animado ---------- */
function useAnimatedMoney(value) {
  const [display, setDisplay] = useState(value);
  const current = useRef(value);
  useEffect(() => {
    const from = current.current;
    current.current = value;
    if (REDUCED || from === value) { setDisplay(value); return undefined; }
    let raf;
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / 420);
      const e = 1 - Math.pow(1 - p, 3);
      setDisplay(from + (value - from) * e);
      if (p < 1) raf = requestAnimationFrame(tick);
      else setDisplay(value);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return display;
}

/* ---------- Miniatura con fallback ---------- */
function Thumb({ product, className, showTag, rounded }) {
  const [state, setState] = useState('loading');
  return (
    <div className={`thumb relative grid place-items-center overflow-hidden ${state === 'error' ? 'is-fallback' : ''} ${className}`}>
      <span className={`thumb-emoji absolute ${className.includes('h-12') ? 'text-[17px]' : 'text-[34px]'}`} aria-hidden="true">
        {product.emoji}
      </span>
      {state !== 'error' && (
        <img
          src={product.img} alt={showTag ? product.name : ''} loading="lazy" decoding="async"
          width="360" height="360"
          className={'relative h-full w-full object-cover' + (state === 'loaded' ? ' is-loaded' : '')}
          onLoad={() => setState('loaded')}
          onError={() => setState('error')}
        />
      )}
      {rounded && <span className="pointer-events-none absolute inset-0 rounded-[13px] ring-1 ring-inset ring-white/25 sm:rounded-none" />}
      {showTag && product.tag && (
        <span className="absolute left-2 top-2 rounded-full bg-gold-soft/95 px-2 py-[3px] text-[8.5px] font-extrabold uppercase tracking-[0.12em] text-ink shadow-sm backdrop-blur">
          {product.tag}
        </span>
      )}
    </div>
  );
}

/* ---------- Tarjeta de producto ---------- */
function ProductCard({ product, qty, onInc, onDec, index }) {

        { duration: 340, easing: 'cubic-bezier(.34,1.56,.64,1)' }
      );
    }
    prevQty.current = qty;
  }, [qty]);

  return (
    <article
      className="card fade-up group relative flex gap-3.5 overflow-hidden rounded-[18px] border border-espresso/10 bg-paper p-2.5 shadow-card sm:flex-col sm:gap-0 sm:p-0"

      style={{ animationDelay: Math.min(index * 30, 220) + 'ms' }}

               role="group" aria-label={'Cantidad de ' + product.name}>
            <button type="button" data-act="dec" onClick={() => onDec(product.id)} disabled={qty === 0}

/* ---------- Modal de pedido ---------- */
function OrderSheet({ open, onClose, onBackToMenu, cart, totals, onInc, onDec, onRemove, onClear, notify }) {
  const client = useMemo(readClient, []);
  const [name, setName] = useState(client.name || '');
  const [address, setAddress] = useState(client.address || '');
  const [note, setNote] = useState('');
  const [orderType, setOrderType] = useState(client.orderType === 'delivery' ? 'delivery' : 'recojo');
  const [payment, setPayment] = useState(client.payment === 'efectivo' ? 'efectivo' : 'yape');
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);

  const nameRef = useRef(null);
  const addressRef = useRef(null);
  const titleRef = useRef(null);
  const sentTimer = useRef(null);

  const total = useAnimatedMoney(totals.total);
  const hasItems = totals.list.length > 0;

  /* Bloqueo de scroll + Escape + foco */
  useEffect(() => {
    if (!open) return undefined;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const t = setTimeout(() => titleRef.current && titleRef.current.focus({ preventScroll: true }), 320);
    return () => {
      document.body.style.overflow = prev;
      document.removeEventListener('keydown', onKey);
      clearTimeout(t);
    };
  }, [open, onClose]);

  useEffect(() => () => clearTimeout(sentTimer.current), []);

  function send() {
    const nextErrors = {
      name: name.trim().length < 2,
      address: orderType === 'delivery' && address.trim().length < 4
    };
    setErrors(nextErrors);

    if (nextErrors.name) {
      if (nameRef.current) {
        nameRef.current.focus();
        nameRef.current.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' });
      }
      return;
    }
    if (nextErrors.address) {
      if (addressRef.current) {
        addressRef.current.focus();
        addressRef.current.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' });
      }
      return;
    }
    if (!hasItems) { notify('Tu pedido está vacío'); return; }

    const stamp = new Intl.DateTimeFormat('es-PE', {
      timeZone:'America/Lima', day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit', hour12:true
    }).format(new Date());

    const lines = [
      '*NUEVO PEDIDO — ALVIÑA PRIMAVERA* ☕🥪',
      '────────────────────',
      '👤 *Nombre:* ' + name.trim(),
      '🛍️ *Tipo:* ' + TYPE_LABEL[orderType],
      orderType === 'delivery' ? '📍 *Dirección:* ' + address.trim() : null,
      '💳 *Pago:* ' + PAY_LABEL[payment],
      note.trim() ? '📝 *Nota:* ' + note.trim() : null,
      '────────────────────',
      '*DETALLE DEL PEDIDO*',
      ...totals.list.map((p) => '• ' + p.qty + ' × ' + p.name + ' — ' + money(p.line)),
      '────────────────────',
      '*TOTAL A PAGAR: ' + money(totals.total) + '*',
      '_' + totals.qty + ' ' + (totals.qty === 1 ? 'producto' : 'productos') + ' · ' + stamp + '_',
      '',
      '¡Gracias! Pedido enviado desde la carta digital 💛'
    ].filter(Boolean);

    const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));

    try {
      localStorage.setItem(CLIENT_KEY, JSON.stringify({
        name: name.trim(), address: address.trim(), payment, orderType
      }));
    } catch (e) { /* ignorar */ }

    window.open(url, '_blank', 'noopener');
    notify('Abriendo WhatsApp con tu pedido');
    setSent(true);
    clearTimeout(sentTimer.current);
    sentTimer.current = setTimeout(() => setSent(false), 2600);
  }

  const field = (hasError) => 'field w-full rounded-xl border border-espresso/10 bg-paper px-4 text-[15px] text-espresso ' + (hasError ? 'is-error' : '');

  return (
    <div
      id="overlay"
      className={'fixed inset-0 z-50 flex items-end justify-center bg-ink/50 backdrop-blur-[3px] md:items-center' + (open ? ' is-open' : '')}
      role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden={!open}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div id="sheet" className="flex w-full flex-col overflow-hidden rounded-t-[26px] bg-cream shadow-sheet md:max-w-lg md:rounded-[26px]">

        <div className="shrink-0 border-b border-espresso/10 bg-paper px-5 pb-3.5 pt-3">
          <div className="mx-auto mb-3 h-1 w-10 rounded-full bg-espresso/15 md:hidden"></div>
          <div className="flex items-center justify-between gap-3">
            <div className="min-w-0">
              <p className="text-[9px] font-extrabold uppercase tracking-[0.26em] text-gold-deep">Alviña Primavera</p>
              <h2 id="sheetTitle" ref={titleRef} tabIndex="-1"
                  className="mt-1 font-display text-[21px] font-semibold leading-none text-espresso outline-none">Tu pedido</h2>
            </div>
            <div className="flex items-center gap-1.5">
              {hasItems && (
                <button id="clearCart" type="button" onClick={onClear}
                        className="rounded-full px-2.5 py-1.5 text-[10.5px] font-bold uppercase tracking-wide text-coffee/50 transition hover:bg-cream-deep hover:text-coffee active:scale-95">
                  Vaciar
                </button>
              )}
              <button id="closeSheet" type="button" onClick={onClose} aria-label="Cerrar"
                      className="grid h-9 w-9 place-items-center rounded-full border border-espresso/10 bg-cream text-coffee transition active:scale-95 hover:bg-cream-deep">
                <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
              </button>
            </div>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto overscroll-contain px-5 py-4">

          {hasItems ? (
            <div id="cartList">
              {totals.list.map((p) => (
                <div key={p.id} className="flex items-center gap-3 border-b border-dashed border-espresso/10 py-3 last:border-0">
                  <Thumb product={p} className="h-12 w-12 shrink-0 rounded-[10px]" />
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-[12.5px] font-extrabold leading-tight text-espresso">{p.name}</p>
                    <p className="mt-0.5 text-[10.5px] text-coffee/45">{money(p.price)} c/u</p>
                  </div>
                  <div className="flex items-center gap-1 rounded-full border border-espresso/10 bg-cream/70 p-[2px]">
                    <button type="button" data-cart="dec" data-id={p.id} onClick={() => onDec(p.id)} aria-label={'Quitar uno de ' + p.name}
                            className="step-btn grid h-7 w-7 place-items-center rounded-full text-[15px] font-bold leading-none text-coffee/70 active:bg-cream-deep">−</button>
                    <span className="w-4 text-center text-[12px] font-extrabold tabular-nums text-espresso">{p.qty}</span>
                    <button type="button" data-cart="inc" data-id={p.id} onClick={() => onInc(p.id)} aria-label={'Agregar uno de ' + p.name}
                            className="step-btn grid h-7 w-7 place-items-center rounded-full bg-espresso text-[15px] font-bold leading-none text-cream active:bg-coffee">+</button>
                  </div>
                  <div className="w-[58px] shrink-0 text-right">
                    <p className="text-[12.5px] font-extrabold tabular-nums text-espresso">{money(p.line)}</p>
                    <button type="button" data-cart="del" data-id={p.id} onClick={() => onRemove(p.id)}
                            className="text-[10px] font-semibold text-coffee/40 transition hover:text-red-600">Quitar</button>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div id="cartEmpty" className="py-12 text-center">
              <div className="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-full border border-espresso/10 bg-paper text-2xl shadow-card">🧺</div>
              <h3 className="font-display text-lg font-semibold text-espresso">Tu pedido está vacío</h3>
              <p className="mt-1 text-[12.5px] text-coffee/60">Agrega algo rico de la carta para empezar.</p>
              <button id="backToMenu" type="button" onClick={onBackToMenu}
                      className="mt-5 rounded-full bg-espresso px-5 py-3 text-[12.5px] font-extrabold tracking-wide text-cream transition active:scale-95">
                Volver a la carta
              </button>
            </div>
          )}

          <div id="orderForm" className={'mt-5 space-y-5' + (hasItems ? '' : ' hidden')}>

            <div>
              <label htmlFor="fName" className="mb-1.5 block text-[10px] font-extrabold uppercase tracking-[0.2em] text-coffee/60">
                Tu nombre <span className="text-red-600">*</span>
              </label>
              <input id="fName" ref={nameRef} type="text" autoComplete="name" placeholder="Ej. María Fernanda"
                     value={name} onChange={(e) => { setName(e.target.value); setErrors((s) => ({ ...s, name:false })); }}
                     className={field(errors.name) + ' py-3.5'} />
              {errors.name && <p className="err mt-1.5 text-[11px] font-semibold text-red-600">Escribe tu nombre para el pedido.</p>}
            </div>

            <div>
              <p className="mb-1.5 block text-[10px] font-extrabold uppercase tracking-[0.2em] text-coffee/60">¿Cómo lo quieres?</p>
              <div className="grid grid-cols-2 gap-2.5" role="group" aria-label="Tipo de entrega">

                  { id:'delivery', icon:'🛵', title:'Delivery cercano', sub:'Costo por coordinar' }
                ].map((o) => (
                  <button key={o.id} type="button" onClick={() => { setOrderType(o.id); setErrors((s) => ({ ...s, address:false })); }}
                          className="opt relative rounded-xl border border-espresso/10 bg-paper p-3 text-left" aria-pressed={orderType === o.id} data-type={o.id}>
                    <span className="opt-check absolute right-2 top-2 grid h-4 w-4 place-items-center rounded-full bg-espresso">
                      <svg className="h-2.5 w-2.5 text-cream" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><path d="m5 13 4 4L19 7" /></svg>
                    </span>
                    <span className="block text-base">{o.icon}</span>
                    <span className="mt-1 block text-[12.5px] font-extrabold leading-tight text-espresso">{o.title}</span>
                    <span className="mt-0.5 block text-[10px] text-coffee/50">{o.sub}</span>
                  </button>
                ))}
              </div>
            </div>

            <p id="pickupNote" className={'flex items-start gap-2 rounded-xl border border-espresso/10 bg-cream-deep/60 px-3.5 py-2.5 text-[11px] leading-snug text-coffee/60' + (orderType === 'delivery' ? ' hidden' : '')}>
              <span aria-hidden="true">🏪</span>
              <span>Te esperamos en el local. Si envías a alguien, avísanos por WhatsApp.</span>

            <div id="addressWrap" className={orderType === 'delivery' ? '' : 'hidden'}>
              <label htmlFor="fAddress" className="mb-1.5 block text-[10px] font-extrabold uppercase tracking-[0.2em] text-coffee/60">
                Dirección de entrega <span className="text-red-600">*</span>

              <input id="fAddress" ref={addressRef} type="text" autoComplete="street-address" placeholder="Calle, número y referencia"
                     value={address} onChange={(e) => { setAddress(e.target.value); setErrors((s) => ({ ...s, address:false })); }}
                     className={field(errors.address) + ' py-3.5'} />
              {errors.address && <p className="err mt-1.5 text-[11px] font-semibold text-red-600">Indica tu dirección para el delivery.</p>}
              <p className="mt-1.5 text-[10.5px] text-coffee/45">Zona cercana al local. El costo de envío se confirma por WhatsApp.</p>

            <div>
              <p className="mb-1.5 block text-[10px] font-extrabold uppercase tracking-[0.2em] text-coffee/60">

  const [toast, setToast] = useState(null);

  const barRef = useRef(null);
  const toastTimer = useRef(null);
  const lastFocused = useRef(null);

  /* Persistencia del carrito */
  useEffect(() => {
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) { /* ignorar */ }
  }, [cart]);

  /* Estado abierto/cerrado */
  useEffect(() => {
    const id = setInterval(() => setStatus(computeStatus()), 60 * 1000);
    return () => clearInterval(id);
  }, []);

  /* Revelado de secciones */
  useEffect(() => {
    const els = Array.from(document.querySelectorAll('.reveal'));
    if (!('IntersectionObserver' in window) || REDUCED) {
      els.forEach((el) => el.classList.add('is-in'));
      return undefined;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  const notify = useCallback((msg) => {
    setToast({ msg, id: Date.now() });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }, []);

  useEffect(() => () => clearTimeout(toastTimer.current), []);

  /* Carrito */
  const changeQty = useCallback((id, delta) => {
    setCart((prev) => {
      const current = prev[id] || 0;
      const next = Math.max(0, Math.min(99, current + delta));
      if (next === current) return prev;
      const copy = { ...prev };
      if (next === 0) delete copy[id]; else copy[id] = next;
      return copy;
    });

    if (delta > 0) {
      const p = byId(id);
      if (p) notify('+1 ' + p.name + ' · ' + money(p.price));
      if (barRef.current && !REDUCED && typeof barRef.current.animate === 'function') {
        barRef.current.animate(
          [{ transform:'scale(1)' }, { transform:'scale(1.03)' }, { transform:'scale(1)' }],
          { duration: 380, easing: 'cubic-bezier(.34,1.4,.64,1)' }
        );
      }
    }
  }, [notify]);

  const inc = useCallback((id) => changeQty(id, 1), [changeQty]);
  const dec = useCallback((id) => changeQty(id, -1), [changeQty]);

  const remove = useCallback((id) => {
    const p = byId(id);
    setCart((prev) => {
      if (!prev[id]) return prev;
      const copy = { ...prev };
      delete copy[id];
      return copy;
    });
    if (p) notify('Quitaste ' + p.name);
  }, [notify]);

  const clear = useCallback(() => {
    setCart({});
    notify('Pedido vaciado');
  }, [notify]);

  /* Derivados */
  const totals = useMemo(() => {
    const list = Object.keys(cart)
      .filter((id) => cart[id] > 0 && byId(id))
      .map((id) => {
        const p = byId(id);
        return { ...p, qty: cart[id], line: p.price * cart[id] };
      });
    return {
      list,
      qty: list.reduce((a, i) => a + i.qty, 0),
      total: list.reduce((a, i) => a + i.line, 0)
    };
  }, [cart]);

  const visible = useMemo(() => {
    const q = norm(query.trim());
    return PRODUCTS.filter((p) => {
      if (cat !== 'todos' && p.cat !== cat) return false;
      if (!q) return true;
      return norm(p.name).includes(q) || norm(p.desc).includes(q);
    });
  }, [cat, query]);

  const barTotal = useAnimatedMoney(totals.total);
  const activeCat = CATEGORIES.find((c) => c.id === cat);
  const resultLabel = visible.length === 1
    ? '1 producto encontrado'
    : visible.length + ' productos ' + (query ? 'encontrados' : 'disponibles');

  const openSheet = () => {
    if (totals.qty === 0) { notify('Agrega algo a tu pedido primero'); return; }
    lastFocused.current = document.activeElement;
    setSheetOpen(true);
  };
  const closeSheet = useCallback(() => {
    setSheetOpen(false);
    if (lastFocused.current && lastFocused.current.focus) {
      lastFocused.current.focus({ preventScroll: true });
    }
  }, []);

  return (
    <React.Fragment>
      {/* Cinta superior */}
      <div className="topbar grain">
        <div className="mx-auto flex max-w-5xl items-center justify-center gap-2 overflow-hidden px-4 py-1.5 text-[9px] font-semibold uppercase tracking-[0.18em] sm:text-[10px] sm:tracking-[0.22em]">
          <span className="text-gold/70">✦</span>
          <span>Pedidos por WhatsApp · +51 935 466 580</span>
          <span className="text-gold/70">✦</span>
        </div>
      </div>

      {/* Encabezado */}
      <header className="relative overflow-hidden">
        <div className="pointer-events-none absolute -top-24 right-0 h-64 w-64 rounded-full bg-gold/10 blur-3xl"></div>

        <div className="relative mx-auto max-w-5xl px-4 pt-5">
          <div className="flex items-center justify-between gap-3">
            <div className="flex min-w-0 items-center gap-3">
              <div className="monogram grid h-12 w-12 shrink-0 place-items-center rounded-[14px] border border-gold/30">
                <span className="font-display text-[22px] font-semibold leading-none text-gold-soft">A</span>
              </div>
              <div className="min-w-0">
                <h1 className="truncate font-display text-[24px] font-semibold leading-none tracking-tight text-espresso sm:text-[27px]">
                  Alviña <span className="italic text-gold-deep">Primavera</span>
                </h1>
                <p className="mt-1.5 text-[9.5px] font-extrabold uppercase tracking-[0.26em] text-coffee/60">
                  Cafetería · Sanguches · Jugos
                </p>
              </div>
            </div>
          </div>

          <Hero status={status} />

          {/* Buscador */}
          <div className="relative mt-4">
            <svg className="pointer-events-none absolute left-4 top-1/2 h-[18px] w-[18px] -translate-y-1/2 text-coffee/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round">
              <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
            </svg>
            <input
              id="search" type="search" inputMode="search" autoComplete="off" enterKeyHint="search"
              placeholder="Buscar sánguche, jugo, café…" aria-label="Buscar en la carta"
              value={query} onChange={(e) => setQuery(e.target.value)}
              className="field w-full appearance-none rounded-2xl border border-espresso/10 bg-paper py-3.5 pl-11 pr-11 text-[15px] text-espresso shadow-card"
            />
            {query && (
              <button id="clearSearch" type="button" aria-label="Limpiar búsqueda" onClick={() => setQuery('')}
                      className="absolute right-2.5 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-full text-coffee/50 transition hover:bg-cream-deep active:scale-95">
                <svg className="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
              </button>
            )}
          </div>
        </div>
      </header>

      {/* Categorías */}
      <nav className="sticky top-0 z-30 mt-4 border-y border-espresso/10 bg-cream/95 backdrop-blur-md">
        <div className="mx-auto max-w-5xl">
          <div id="tabs" role="tablist" aria-label="Categorías de la carta"
               className="no-scrollbar flex gap-2 overflow-x-auto px-4 py-3">
            {CATEGORIES.map((c) => (
              <button key={c.id} type="button" role="tab" data-cat={c.id}
                      aria-selected={cat === c.id} onClick={() => setCat(c.id)}
                      className="tab inline-flex items-center gap-1.5 whitespace-nowrap rounded-full border border-espresso/10 bg-paper px-3.5 py-2 text-[12.5px] font-bold text-coffee/75">
                <span aria-hidden="true" className="text-[12px]">{c.emoji}</span>{c.label}
              </button>
            ))}
          </div>
        </div>
      </nav>

      {/* Contenido */}
      <main className="mx-auto max-w-5xl px-4 pb-safe pt-5">
        <div className="reveal mb-3.5 flex items-end justify-between gap-3">
          <div>
            <h2 id="sectionTitle" className="font-display text-[22px] font-semibold leading-none text-espresso">
              {query ? 'Resultados' : (activeCat.id === 'todos' ? 'Toda la carta' : activeCat.label)}
            </h2>
            <p id="resultInfo" className="mt-1.5 text-[11.5px] font-medium text-coffee/55">{resultLabel}</p>
          </div>
          <div className="hidden items-center gap-2 rounded-full border border-espresso/10 bg-paper px-3 py-1.5 text-[10.5px] font-semibold text-coffee/60 sm:flex">
            <span className="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Precios en Soles
          </div>
        </div>

        <section id="grid" aria-live="polite"
                 className={'grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3' + (visible.length === 0 ? ' hidden' : '')}>
          {visible.map((p, i) => (
            <ProductCard key={p.id} product={p} qty={cart[p.id] || 0} onInc={inc} onDec={dec} index={i} />
          ))}
        </section>

        {visible.length === 0 && (
          <section id="empty" className="py-16 text-center">
            <div className="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-full border border-espresso/10 bg-paper text-2xl shadow-card">🔍</div>
            <h3 className="font-display text-xl font-semibold text-espresso">No encontramos ese producto</h3>
            <p className="mx-auto mt-1.5 max-w-[26ch] text-[12.5px] leading-relaxed text-coffee/60">Prueba con otra palabra o vuelve a ver toda la carta.</p>
            <button id="resetFilters" type="button" onClick={() => { setCat('todos'); setQuery(''); }}
                    className="mt-5 inline-flex items-center gap-2 rounded-full bg-espresso px-5 py-3 text-[12.5px] font-extrabold tracking-wide text-cream shadow-card transition active:scale-95">
              Ver toda la carta
            </button>
          </section>
        )}

        <Benefits />
        <Contact />
        <Footer />
      </main>

      {/* Barra flotante */}
      <div id="floatBar" className="float-bar fixed inset-x-0 bottom-0 z-40 px-3 pb-[calc(0.7rem+env(safe-area-inset-bottom))] pt-1">
        <div ref={barRef} className="grain mx-auto flex max-w-2xl items-center gap-3 overflow-hidden rounded-[18px] border border-white/10 bg-gradient-to-r from-[#2E1B0F] to-[#1A0F08] p-2.5 pl-4 shadow-bar">
          <div className="relative z-[2] min-w-0">
            <p className="text-[9.5px] font-extrabold uppercase leading-none tracking-[0.2em] text-cream/45">
              <span id="barCount">{totals.qty}</span> <span id="barCountLabel">{totals.qty === 1 ? 'ítem' : 'ítems'}</span>
            </p>
            <p id="barTotal" className="mt-1 font-display text-[21px] font-medium leading-none text-gold-soft">{money(barTotal)}</p>
          </div>

          <button id="viewOrder" type="button" onClick={openSheet} disabled={totals.qty === 0}
                  className="relative z-[2] ml-auto inline-flex shrink-0 items-center gap-2 rounded-[13px] bg-cream px-4 py-3.5 text-[12.5px] font-extrabold tracking-wide text-espresso shadow-soft transition active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-40">
            Ver Pedido
            <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>

      <OrderSheet
        open={sheetOpen}
        onClose={closeSheet}
        onBackToMenu={() => { closeSheet(); window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); }}
        cart={cart}
        totals={totals}
        onInc={inc}
        onDec={dec}
        onRemove={remove}
        onClear={clear}
        notify={notify}
      />

      {/* Toast */}
      <div id="toast" role="status" aria-live="polite"
           className={'pointer-events-none fixed bottom-[6.6rem] left-1/2 z-[60] flex max-w-[92vw] -translate-x-1/2 translate-y-3 items-center gap-2 overflow-hidden rounded-full bg-espresso px-4 py-2.5 text-[11.5px] font-bold text-cream shadow-bar' + (toast ? ' show' : '')}
           style={{ opacity: toast ? undefined : 0 }}>
        {toast && (
          <React.Fragment>
            <span className="h-1.5 w-1.5 shrink-0 rounded-full bg-gold-soft"></span>
            <span className="truncate" style={{ minWidth: 0 }}>{toast.msg}</span>
          </React.Fragment>
        )}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
